<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-label="Construccion del sueno AGIGOV">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="30%" stop-color="#60a5fa"/>
      <stop offset="55%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5efe4"/>
      <stop offset="100%" stop-color="#a89578"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.72" cy="0.18" r="0.28">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1440" height="900" fill="url(#sky)"/>
  <rect width="1440" height="900" fill="url(#sun)"/>

  <!-- Colinas -->
  <ellipse cx="720" cy="780" rx="640" ry="100" fill="#d4c4a8" opacity="0.7"/>
  <path d="M0 720 Q480 660 960 690 T1440 710 L1440 900 L0 900 Z" fill="#e8dcc8" opacity="0.85"/>

  <!-- Camino -->
  <path d="M0 780 Q720 740 1440 770" fill="none" stroke="#c9b896" stroke-width="36" stroke-linecap="round" opacity="0.75"/>

  <!-- Templo en construccion � centrado y grande -->
  <g fill="url(#stone)">
    <rect x="220" y="420" width="32" height="320" rx="2"/>
    <rect x="320" y="410" width="32" height="330" rx="2"/>
    <rect x="420" y="400" width="32" height="340" rx="2"/>
    <rect x="520" y="390" width="32" height="350" rx="2"/>
    <rect x="620" y="380" width="32" height="360" rx="2"/>
    <rect x="720" y="375" width="32" height="365" rx="2"/>
    <rect x="820" y="380" width="32" height="360" rx="2"/>
    <rect x="920" y="390" width="32" height="350" rx="2"/>
    <rect x="1020" y="400" width="32" height="340" rx="2"/>
    <rect x="1120" y="410" width="32" height="330" rx="2"/>
    <rect x="1220" y="420" width="32" height="320" rx="2"/>
  </g>
  <rect x="200" y="365" width="1040" height="20" fill="#faf8f5" rx="2"/>
  <path d="M560 365 Q720 220 880 365 L860 395 L580 395 Z" fill="url(#stone)"/>
  <path d="M600 365 Q720 250 840 365" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.5" stroke-dasharray="6 4"/>

  <!-- Andamiaje -->
  <g stroke="#64748b" stroke-width="2" fill="none" opacity="0.5">
    <line x1="200" y1="760" x2="200" y2="340"/>
    <line x1="1240" y1="760" x2="1240" y2="340"/>
    <line x1="200" y1="520" x2="1240" y2="520"/>
    <line x1="480" y1="760" x2="480" y2="380"/>
    <line x1="960" y1="760" x2="960" y2="380"/>
  </g>

  <!-- Gr�a -->
  <g stroke="#334155" stroke-width="4" fill="none">
    <line x1="1100" y1="760" x2="1100" y2="280"/>
    <line x1="1100" y1="310" x2="940" y2="360"/>
    <line x1="940" y1="360" x2="940" y2="410" stroke="#0052ff" stroke-width="2.5" stroke-dasharray="5 4"/>
  </g>

  <!-- Comunidad caminando -->
  <g fill="#0052ff" opacity="0.85">
    <circle cx="160" cy="730" r="6" fill="#78350f"/>
    <rect x="154" y="738" width="12" height="18" rx="2"/>
    <circle cx="200" cy="738" r="6" fill="#78350f"/>
    <rect x="194" y="746" width="12" height="18" rx="2"/>
    <circle cx="1240" cy="735" r="6" fill="#78350f"/>
    <rect x="1234" y="743" width="12" height="18" rx="2"/>
    <circle cx="1285" cy="742" r="6" fill="#78350f"/>
    <rect x="1279" y="750" width="12" height="18" rx="2"/>
  </g>

  <!-- Trabajadores -->
  <g fill="#b45309">
    <circle cx="580" cy="700" r="7" fill="#92400e"/>
    <rect x="572" y="710" width="16" height="22" rx="3" fill="#b45309"/>
    <circle cx="860" cy="695" r="7" fill="#92400e"/>
    <rect x="852" y="705" width="16" height="22" rx="3" fill="#b45309"/>
  </g>

  <!-- Vi�eta suave -->
  <rect width="1440" height="900" fill="url(#sky)" opacity="0" />
  <rect width="1440" height="900" fill="#0f172a" opacity="0.06"/>
</svg>

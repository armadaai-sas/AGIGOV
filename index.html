<!doctype html>
<html lang="es" data-agigov-skin="trust" data-agigov-landing="1">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="AGIGOV — Gobernanza y política verificables para la era post-IA. Modelo genérico, implementaciones nacionales y plataforma ciudadana." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AGIGOV" />
    <link rel="icon" href="/icons/icon-192.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <link rel="mask-icon" href="/icons/icon-192.svg" color="#0052ff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
    />
    <title>AGIGOV — Plataforma institucional</title>
    <style>
      html, body { margin: 0; background: #ffffff; }
      html[data-agigov-landing] {
        color-scheme: light;
        --color-agigov-void: #ffffff;
        --color-agigov-text: #18181b;
        --color-agigov-text-muted: #71717a;
        --color-agigov-navy: #ffffff;
        --color-agigov-console: #fafafa;
        background: #ffffff;
      }
      #agigov-boot {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 1.5rem;
        font-family: Inter, system-ui, sans-serif;
        color: #71717a;
        text-align: center;
      }
      #agigov-boot svg { width: 48px; height: 48px; display: block; }
      #agigov-boot strong {
        display: block;
        margin-top: 0.35rem;
        font-size: 1.15rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #18181b;
      }
      #agigov-boot p {
        margin: 0;
        font-size: 0.8125rem;
        font-weight: 400;
      }
      #agigov-boot .pulse {
        width: 3.5rem;
        height: 0.2rem;
        border-radius: 999px;
        background: #f4f4f5;
        overflow: hidden;
        position: relative;
      }
      #agigov-boot .pulse::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        background: #18181b;
        animation: agigov-boot-pulse 1.1s ease-in-out infinite;
      }
      @keyframes agigov-boot-pulse {
        from { transform: translateX(-100%); }
        to { transform: translateX(350%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="agigov-boot" role="status" aria-live="polite" aria-busy="true">
        <div>
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="24" cy="24" r="20" stroke="#e4e4e7" stroke-width="1" fill="none" />
            <path d="M24 10l10.5 6v12L24 34l-10.5-6V16L24 10z" fill="url(#bootCore)" />
            <circle cx="24" cy="22" r="2.5" fill="#ffffff" opacity="0.95" />
            <defs>
              <linearGradient id="bootCore" x1="14" y1="10" x2="34" y2="38">
                <stop offset="0%" stop-color="#0052ff" />
                <stop offset="100%" stop-color="#003db8" />
              </linearGradient>
            </defs>
          </svg>
          <strong>AGIGOV</strong>
        </div>
        <p>Cargando…</p>
        <div class="pulse" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

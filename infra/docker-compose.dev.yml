# Desarrollo local — MQTT en localhost:1883 (sin WireGuard)
# Uso: docker compose -f infra/docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: agigov-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: agigov
      POSTGRES_PASSWORD: agigov
      POSTGRES_DB: agigov_core
    ports:
      - "5432:5432"
    volumes:
      - agigov-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agigov -d agigov_core"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: agigov-mosquitto-dev
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-dev-data:/mosquitto/data

volumes:
  agigov-postgres-data:
  mosquitto-dev-data:

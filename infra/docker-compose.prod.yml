# Core pre-producción — Postgres, Mosquitto, API, enjambre, honeypot
# Uso:
#   cp infra/.env.prod.example infra/.env.prod
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d --build

x-agent: &agent
  build:
    context: ..
    dockerfile: infra/core/Dockerfile
  restart: always
  env_file: .env.prod
  command: ['bus-worker']
  environment:
    NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=96}
  volumes:
    - agent-data:/data
  depends_on:
    postgres:
      condition: service_healthy
    mosquitto:
      condition: service_started
  deploy:
    resources:
      limits:
        memory: 192M

services:
  postgres:
    image: postgres:16-alpine
    container_name: agigov-postgres-prod
    restart: always
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=50
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agigov}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-agigov_core}
    volumes:
      - agigov-prod-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-agigov} -d ${POSTGRES_DB:-agigov_core}']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: agigov-mosquitto-prod
    restart: always
    volumes:
      - ./mosquitto/mosquitto.prod.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-prod-data:/mosquitto/data
    deploy:
      resources:
        limits:
          memory: 64M

  public-api:
    build:
      context: ..
      dockerfile: infra/core/Dockerfile
    container_name: agigov-public-api-prod
    restart: always
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agigov}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agigov_core}?schema=public
    ports:
      - '3001:3001'
    command: ['public-api']
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 192M

  honeypot:
    build:
      context: ..
      dockerfile: infra/core/Dockerfile
    container_name: agigov-honeypot-prod
    restart: always
    env_file: .env.prod
    environment:
      MQTT_URL: mqtt://mosquitto:1883
    ports:
      - '8088:8088'
    command: ['honeypot']
    depends_on:
      - mosquitto
    deploy:
      resources:
        limits:
          memory: 64M

  agent-centinela:
    <<: *agent
    container_name: agigov-agent-centinela
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agigov}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agigov_core}?schema=public
      MQTT_URL: mqtt://mosquitto:1883
      AGENT_ROLE: centinela
      NODE_DID: did:agigov:core:centinela

  agent-logistico:
    <<: *agent
    container_name: agigov-agent-logistico
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agigov}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agigov_core}?schema=public
      MQTT_URL: mqtt://mosquitto:1883
      AGENT_ROLE: logistico
      NODE_DID: did:agigov:core:logistico

  agent-soberano:
    <<: *agent
    container_name: agigov-agent-soberano
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agigov}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agigov_core}?schema=public
      MQTT_URL: mqtt://mosquitto:1883
      AGENT_ROLE: soberano
      NODE_DID: did:agigov:core:soberano

  agent-conciliador:
    <<: *agent
    container_name: agigov-agent-conciliador
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agigov}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agigov_core}?schema=public
      MQTT_URL: mqtt://mosquitto:1883
      AGENT_ROLE: conciliador
      NODE_DID: did:agigov:core:conciliador

  agent-comunicador:
    <<: *agent
    container_name: agigov-agent-comunicador
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agigov}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agigov_core}?schema=public
      MQTT_URL: mqtt://mosquitto:1883
      AGENT_ROLE: comunicador
      NODE_DID: did:agigov:core:comunicador

volumes:
  agigov-prod-pg:
  mosquitto-prod-data:
  agent-data:

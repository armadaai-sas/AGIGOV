# Gateway Bridge — UDP :1700 para gateways LoRaWAN físicos (dev)

[integration]
  marshaler="json"

  [integration.mqtt]
    event_topic_template="gateway/{{ .GatewayID }}/event/{{ .EventType }}"
    command_topic_template="gateway/{{ .GatewayID }}/command/{{ .CommandType }}"
    server="tcp://host.docker.internal:1883"

[backend]
  type="semtech_udp"

  [backend.semtech_udp]
    bind="0.0.0.0:1700"

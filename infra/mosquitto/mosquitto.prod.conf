# Mosquitto pre-producción — sin anonymous (configurar ACL en despliegue real)
listener 1883 0.0.0.0
protocol mqtt

allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning

max_inflight_messages 100
max_queued_messages 500
message_size_limit 262144

# PROD: reemplazar con password_file + aclfile antes de internet

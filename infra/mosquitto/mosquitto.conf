# Armada sovereign bus — Mosquitto 2.x
# DEV: allow_anonymous true. PROD: usar password_file + ACL.

listener 1883 0.0.0.0
protocol mqtt

allow_anonymous true

# Persistencia mínima (QoS 1)
persistence true
persistence_location /mosquitto/data/

# Logs
log_dest stdout
log_type error
log_type warning
log_type notice

# Límites razonables para nodos edge
max_inflight_messages 50
max_queued_messages 200
message_size_limit 262144

appId: com.agigov.armada
productName: AGIGOV
copyright: Copyright © Armada IA SAS

directories:
  output: release/desktop
  buildResources: desktop/assets

files:
  - dist/**/*
  - desktop/main.mjs
  - desktop/preload.mjs
  - package.json

extraMetadata:
  main: desktop/main.mjs

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  artifactName: AGIGOV-Setup-${version}-win-${arch}.${ext}
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AGIGOV

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  artifactName: AGIGOV-${version}-mac-${arch}.${ext}
  category: public.app-category.productivity
  hardenedRuntime: false

linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
  artifactName: AGIGOV-${version}-linux-${arch}.${ext}
  category: Office
  synopsis: Sistema operativo institucional AGIGOV
  description: Cliente de escritorio para el OS soberano AGIGOV — modelos, custodia y gestión pública.

publish: null

# Workflow Dify — Pipeline logístico (Fase 3 stub)
# P3: referencia solamente — runtime = src/agents/ · ver workflows/README.md
# Exportar a Dify v1.x; conectar tools HTTP → src/agents handlers

name: agigov-logistico-v1
version: "1.0.0"
trigger: validation-result
nodes:
  - id: ingest
    type: start
    input: evidenceBundle
  - id: allocate
    type: llm
    tool: agigov-upsert-escrow
    prompt: "Optimizar asignación según facts territoriales. Solo hechos verificables."
  - id: handoff
    type: http
    url: "${AGIGOV_BUS_URL}/handoff"
    body:
      intent: allocate-resources
      recipient: did:agigov:core:centinela
  - id: end
    type: end

name: Deploy prod-light (DigitalOcean)

# Deploy cloud-only: GitHub Actions → Droplet. PWA built on CI (no OOM on 1GB droplet).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.cursor/**'

concurrency:
  group: deploy-prod-light
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
      DROPLET_USER: ${{ secrets.DROPLET_USER }}
      DROPLET_DIR: ${{ secrets.DROPLET_DIR }}

    steps:
      - name: Require deploy secrets
        run: |
          missing=0
          for v in DROPLET_HOST DROPLET_USER DROPLET_SSH_KEY; do
            if [ -z "${!v:-}" ] && [ "$v" != "DROPLET_SSH_KEY" ]; then
              echo "Missing secret: $v"
              missing=1
            fi
          done
          if [ -z "${{ secrets.DROPLET_SSH_KEY }}" ]; then
            echo "Missing secret: DROPLET_SSH_KEY"
            missing=1
          fi
          if [ -z "$DROPLET_HOST" ] || [ -z "$DROPLET_USER" ]; then
            missing=1
          fi
          if [ "$missing" = "1" ]; then
            echo "Configure repo secrets: DROPLET_HOST, DROPLET_USER, DROPLET_SSH_KEY (optional DROPLET_DIR=/opt/armada)"
            exit 1
          fi
          echo "DROPLET_DIR=${DROPLET_DIR:-/opt/armada}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build PWA on CI
        run: |
          npm ci
          npm run build
          test -f dist/index.html

      - name: Setup SSH deploy key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/do_deploy
          chmod 600 ~/.ssh/do_deploy
          for i in $(seq 1 5); do
            if ssh-keyscan -T 10 -H "$DROPLET_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              chmod 600 ~/.ssh/known_hosts
              exit 0
            fi
            echo "ssh-keyscan retry $i/5..."
            sleep 5
          done
          echo "ERROR: ssh-keyscan failed for $DROPLET_HOST"
          exit 1

      - name: Sync code + dist to Droplet
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/do_deploy -o IdentitiesOnly=yes -o ConnectTimeout=30" \
            --exclude 'node_modules/' \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude 'infra/.env' \
            --exclude 'infra/.env.prod' \
            --exclude 'data/*.db' \
            --exclude 'data/*.db-*' \
            --exclude 'data/*-keys.json' \
            --exclude 'data/*.core-keys.json' \
            --exclude 'data/*.institution-keys.json' \
            --exclude 'data/email-outbox.jsonl' \
            --exclude 'data/metering-events.jsonl' \
            --exclude '.vite/' \
            --exclude 'coverage/' \
            --exclude '.DS_Store' \
            ./ "${DROPLET_USER}@${DROPLET_HOST}:${DROPLET_DIR}/"

      - name: Restart prod-light + health
        run: |
          ssh -i ~/.ssh/do_deploy -o IdentitiesOnly=yes -o ConnectTimeout=30 \
            "${DROPLET_USER}@${DROPLET_HOST}" bash -s <<EOF
          set -euo pipefail
          cd "${DROPLET_DIR}"
          chmod +x scripts/prod-up-light.sh || true
          TUNNEL=1 ./scripts/prod-up-light.sh
          echo "--- health ---"
          curl -sf "http://127.0.0.1:3001/api/ops/health"
          echo
          docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          URL=""
          for i in \$(seq 1 30); do
            URL=\$(docker logs armada-tunnel-light 2>&1 | grep -Eo 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' | tail -n 1 || true)
            if [ -n "\$URL" ]; then
              echo "HTTPS_URL=\$URL"
              break
            fi
            sleep 2
          done
          if [ -z "\$URL" ]; then
            echo "WARN: Cloudflare quick tunnel URL not ready (HTTP on :80 may still work)"
          fi
          EOF

      - name: Public health + PWA check
        run: |
          for i in $(seq 1 15); do
            if curl -sf --connect-timeout 10 "http://${DROPLET_HOST}:3001/api/ops/health"; then
              echo
              break
            fi
            echo "API :3001 not ready ($i/15)"
            sleep 5
          done
          ok=0
          for i in $(seq 1 20); do
            if curl -sf --connect-timeout 10 "http://${DROPLET_HOST}/api/ops/health"; then
              echo
              ok=1
              break
            fi
            echo "nginx /api not ready yet ($i/20)"
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "ERROR: http://${DROPLET_HOST}/api/ops/health still failing"
            exit 1
          fi
          curl -sfI --connect-timeout 10 "http://${DROPLET_HOST}/" | head -n 5

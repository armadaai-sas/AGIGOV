name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm run test:smoke

      - run: npm run test:billing

      - run: npm run test:webhook

      - run: npm run pqc:inventory

      - run: npm run panic:drill

      - run: npm run p5:verify-network

      - run: npm run p6:verify

      - run: npm run doctor

      - run: npm run p9:go

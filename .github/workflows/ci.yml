name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agigov
          POSTGRES_PASSWORD: agigov
          POSTGRES_DB: agigov_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agigov -d agigov_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://agigov:agigov@127.0.0.1:5432/agigov_core?schema=public
      AGIGOV_PLAN: free
      AGIGOV_HOSTING: byo
      AGIGOV_EMAIL_MODE: outbox
      AGIGOV_AI_ENABLED: '0'
      ORIGIN_NODE_ID: node-ci-01

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npx prisma generate --schema prisma/schema.prisma

      - run: npx prisma generate --schema prisma-edge/schema.prisma

      - run: npx prisma migrate deploy --schema prisma/schema.prisma

      - run: npm run lint

      - run: npm run build

      - run: npm run test:smoke

      - name: Recorrido de beta
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
          npm run dev -- --host 127.0.0.1 --port 4173 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          CHROME_BIN="$(command -v chromium-browser || command -v chromium)" BETA_WALK_URL=http://127.0.0.1:4173 npm run test:beta-walk

      - run: npm run test:billing

      - run: npm run test:webhook

      - run: npm run pqc:inventory

      - run: npm run panic:drill

      - run: npm run p5:verify-network

      - run: npm run p6:verify

      - run: npm run doctor

      - run: npm run db:seed

      - run: npm run p4:finance-e2e

      - run: npm run p9:go

name: Desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Versión semver (ej. 0.1.0)
        required: true
        default: '0.1.0'
  push:
    tags:
      - 'desktop-v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pack: desktop:pack:win
          - os: macos-latest
            pack: desktop:pack:mac
          - os: ubuntu-latest
            pack: desktop:pack:linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Pack desktop (${{ matrix.os }})
        run: npm run ${{ matrix.pack }}
        env:
          VITE_PUBLIC_API_URL: https://137.184.66.163
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: agigov-desktop-${{ matrix.os }}
          path: release/desktop/**
          if-no-files-found: error

  publish-manifest:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update releases manifest
        run: |
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          node scripts/desktop-sync-releases.mjs \
            --version "$VERSION" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-releases-json
          path: public/desktop/releases.json
